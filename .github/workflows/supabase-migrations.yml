name: Supabase Migrations

# VALIDATION ONLY. Applying migrations to production is owned by Supabase
# Branching's "Deploy to production" (GitHub integration), not by this workflow.
#
# There used to be a `deploy` job here running `supabase db push` on main. With
# branching enabled that is a SECOND system pushing to the same project: two
# writers racing on the migration history table, and a failure in one that the
# other cannot see. One owner only.
#
# What is kept is the part branching does NOT give you: a from-scratch replay of
# every migration on a throwaway local Postgres, a linter pass, and a check that
# the committed generated types match the migrated schema. That runs in seconds
# and catches broken SQL before a branch is ever provisioned.
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'src/lib/types/database.generated.ts'
  workflow_dispatch:

jobs:
  validate:
    name: Validate migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest

      # Starts a fresh local Postgres and applies every migration from
      # scratch — fails on broken SQL, bad ordering, or missing objects.
      - name: Apply all migrations to a fresh database
        run: supabase db start

      - name: Lint database
        run: supabase db lint --level error

      # The repo rule is that database.generated.ts is regenerated and
      # committed alongside every migration. Fail the PR when the committed
      # types drift from what the migrated schema actually generates.
      - name: Verify generated types are up to date
        run: |
          supabase gen types typescript --local > /tmp/database.generated.ts
          if ! diff -u src/lib/types/database.generated.ts /tmp/database.generated.ts; then
            echo ""
            echo "::error::src/lib/types/database.generated.ts is out of date."
            echo "Run scripts/regen-db-types.sh --local (with the migration applied) and commit the result."
            exit 1
          fi
